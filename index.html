<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Posture">
<meta name="theme-color" content="#12102E">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>Daily Posture</title>
<style>
  :root {
    --ink: #1D1B4B;
    --sun: #FFD23F;
    --release: #7B5CFF;
    --stretch: #00B894;
    --strength: #FF5A36;
    --rest: #1D1B4B;
    --bg: #12102E;
    --surface: #1F1C47;
    --surface-2: #2C2860;
    --muted: rgba(255,255,255,.6);
    --tabbar: calc(64px + env(safe-area-inset-bottom));
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    font-family: ui-rounded, system-ui, -apple-system, sans-serif;
    color: #fff;
    background: var(--bg);
    -webkit-user-select: none; user-select: none;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
  button:disabled { opacity: .3; cursor: default; }
  .screen {
    min-height: 100dvh;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
    display: flex; flex-direction: column; gap: 16px;
    max-width: 520px; margin: 0 auto;
  }
  .tab { padding-bottom: calc(var(--tabbar) + 24px); }
  [hidden] { display: none !important; }

  /* tabs */
  .head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; padding-top: 12px; }
  .eyebrow { font-size: 13px; font-weight: 800; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
  h1 { font-size: 34px; font-weight: 900; letter-spacing: -.5px; }
  .card { background: var(--surface); border-radius: 22px; padding: 16px; }
  .card-title { display: flex; justify-content: space-between; align-items: baseline; font-size: 17px; font-weight: 800; margin-bottom: 12px; }
  .card-title small { font-size: 14px; color: var(--muted); }
  .hero {
    display: grid; gap: 18px; padding: 20px; border-radius: 28px;
    background: linear-gradient(150deg, #FF5A36, #FF2E7E 55%, #7B5CFF);
    box-shadow: 0 14px 36px rgba(255,46,126,.28);
  }
  .streak b { display: block; font-size: 64px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .streak span { font-weight: 700; opacity: .9; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 12px; font-weight: 800; }
  .week div { opacity: .85; }
  .week i { display: grid; place-items: center; aspect-ratio: 1; margin-top: 6px; border-radius: 50%; background: rgba(255,255,255,.2); font-style: normal; font-size: 14px; }
  .week .done i { background: var(--sun); color: var(--ink); }
  .week .today { opacity: 1; }
  .week .today i { box-shadow: inset 0 0 0 2px #fff; }
  .go {
    background: var(--sun); color: var(--ink);
    font-size: 24px; font-weight: 900; padding: 20px; border-radius: 999px;
    box-shadow: 0 8px 0 #E0A800; transition: transform .1s;
  }
  .go:active { transform: translateY(6px); box-shadow: 0 2px 0 #E0A800; }
  .list { list-style: none; padding: 0; display: grid; gap: 2px; }
  .list li { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-weight: 700; padding: 10px 0; }
  .list li + li { border-top: 1px solid rgba(255,255,255,.07); }
  .list li small { color: var(--muted); font-weight: 700; white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 10px; }
  .legend { display: flex; gap: 14px; margin-top: 12px; font-size: 13px; font-weight: 700; color: var(--muted); text-transform: capitalize; }
  .legend .dot { margin-right: 6px; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .stats div { background: var(--surface); border-radius: 18px; padding: 14px 12px; }
  .stats b { display: block; font-size: 28px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .stats span { font-size: 12px; font-weight: 700; color: var(--muted); }
  .cal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
  .cal-head div { text-align: center; font-weight: 800; font-size: 17px; }
  .cal-head small { display: block; font-size: 13px; color: var(--muted); }
  .nav { width: 44px; height: 44px; border-radius: 50%; background: var(--surface-2); font-size: 22px; font-weight: 900; }
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 6px; text-align: center; font-size: 14px; font-weight: 700; touch-action: pan-y; }
  .cal .dow { color: var(--muted); font-size: 12px; padding-bottom: 4px; }
  .cal .d { aspect-ratio: 1; display: grid; place-items: center; border-radius: 50%; }
  .cal .done { background: var(--sun); color: var(--ink); }
  .cal .today { box-shadow: inset 0 0 0 2px #fff; }
  .cal .future { opacity: .3; }

  .add { background: var(--sun); color: var(--ink); padding: 8px 16px; border-radius: 999px; cursor: pointer; font-weight: 800; }
  .add.ghost { background: var(--surface-2); color: #fff; }
  .pics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .pics button { position: relative; aspect-ratio: 3 / 4; border-radius: 14px; overflow: hidden; padding: 0; background: var(--surface); }
  .pics img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .pics span { position: absolute; left: 6px; bottom: 6px; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.55); padding: 2px 8px; border-radius: 999px; }
  .empty { font-weight: 600; line-height: 1.4; color: var(--muted); }

  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    display: flex; justify-content: center;
    padding-bottom: env(safe-area-inset-bottom);
    background: rgba(18,16,46,.85); -webkit-backdrop-filter: blur(20px); backdrop-filter: blur(20px);
    border-top: 1px solid rgba(255,255,255,.08);
  }
  .tabbar button {
    flex: 1; max-width: 173px; height: 64px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
    font-size: 11px; font-weight: 800; color: var(--muted);
  }
  .tabbar svg { width: 26px; height: 26px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar [aria-selected="true"] { color: var(--sun); }
  .viewer {
    position: fixed; inset: 0; z-index: 10; background: #000; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 16px) 16px calc(env(safe-area-inset-bottom) + 16px);
  }
  .viewer img { flex: 1; min-height: 0; width: 100%; object-fit: contain; }
  .viewer-bar { display: flex; align-items: center; gap: 12px; padding-top: 12px; font-weight: 800; }
  .viewer-bar span { flex: 1; }
  .viewer-bar button { padding: 12px 18px; border-radius: 999px; background: rgba(255,255,255,.18); font-weight: 800; }
  .pic-actions { display: flex; gap: 8px; }
  .slider { position: relative; flex: 1; min-height: 0; touch-action: none; cursor: ew-resize; --x: 50%; }
  .slider img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: contain; pointer-events: none; }
  .slider #cmp-a { clip-path: inset(0 calc(100% - var(--x)) 0 0); }
  .handle { position: absolute; top: 0; bottom: 0; left: var(--x); width: 3px; margin-left: -1.5px; background: #fff; pointer-events: none; }
  .handle::after {
    content: '‹ ›'; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 44px; height: 44px; border-radius: 50%; background: #fff; color: #000;
    display: grid; place-items: center; font-weight: 900; font-size: 20px; letter-spacing: 2px;
  }
  .cmp-pick { display: flex; gap: 12px; padding-top: 12px; }
  .cmp-pick label { flex: 1; display: grid; gap: 4px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; opacity: .9; }
  .cmp-pick label:last-child { text-align: right; }
  .cmp-pick select { font: inherit; font-size: 16px; font-weight: 700; text-transform: none; letter-spacing: 0; color: #fff; background: rgba(255,255,255,.18); border: 0; border-radius: 12px; padding: 10px; }

  /* session */
  #run { transition: background-color .4s; background: var(--rest); max-width: none; }
  #run > * { width: 100%; max-width: 520px; margin: 0 auto; }
  .top { display: flex; align-items: center; justify-content: space-between; font-weight: 800; }
  .icon-btn { width: 48px; height: 48px; border-radius: 50%; background: rgba(255,255,255,.18); font-size: 22px; font-weight: 900; }
  .bar { height: 8px; border-radius: 4px; background: rgba(255,255,255,.25); overflow: hidden; }
  .bar i { display: block; height: 100%; width: 0; background: #fff; border-radius: 4px; }
  .chip { align-self: flex-start; font-size: 13px; font-weight: 900; letter-spacing: 1.5px; text-transform: uppercase; background: rgba(0,0,0,.2); padding: 6px 12px; border-radius: 999px; width: auto !important; margin: 0 !important; }
  #run h2 { font-size: 30px; font-weight: 900; line-height: 1.1; }
  .label { font-weight: 800; font-size: 18px; opacity: .9; min-height: 1.2em; }
  #fig { width: 100%; height: 30dvh; }
  .timer { text-align: center; }
  .timer b { display: block; font-size: 96px; font-weight: 900; line-height: 1; font-variant-numeric: tabular-nums; }
  .timer span { font-weight: 800; font-size: 18px; opacity: .9; }
  .cue { font-size: 18px; font-weight: 600; line-height: 1.35; opacity: .95; }
  .controls { display: flex; justify-content: center; align-items: center; gap: 24px; margin-top: auto !important; }
  .controls button { width: 72px; height: 72px; border-radius: 50%; background: rgba(255,255,255,.2); font-size: 26px; }
  .controls .play { width: 96px; height: 96px; background: #fff; color: var(--ink); font-size: 36px; }

  /* svg */
  .fig polyline { fill: none; stroke: #fff; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
  .fig circle { fill: #fff; }
  .fig .eye { fill: var(--ink); }
  .prop { stroke: rgba(255,255,255,.45); stroke-width: 5; stroke-linecap: round; fill: none; }
  .prop.fill { fill: rgba(255,255,255,.2); stroke: none; }
  .ball { fill: var(--sun); }
  .band { stroke: var(--sun); stroke-width: 4; stroke-linecap: round; }
</style>
</head>
<body>

<main id="home">
<section id="tab-today" class="screen tab">
  <header class="head">
    <div><div class="eyebrow" id="today-date"></div><h1>Daily Posture</h1></div>
  </header>
  <div class="hero">
    <div class="streak"><b id="streak">0</b><span>day streak</span></div>
    <div class="week" id="week"></div>
  </div>
  <button class="go" id="start">Start · <span id="mins"></span> min</button>
  <div class="card">
    <div class="card-title"><span>Today’s routine</span><small id="ex-count"></small></div>
    <ul class="list" id="list"></ul>
    <div class="legend" id="legend"></div>
  </div>
</section>

<section id="tab-history" class="screen tab" hidden>
  <header class="head">
    <div><div class="eyebrow">Your sessions</div><h1>History</h1></div>
  </header>
  <div class="stats">
    <div><b id="st-streak">0</b><span>current streak</span></div>
    <div><b id="st-best">0</b><span>best streak</span></div>
    <div><b id="total">0</b><span>all time</span></div>
  </div>
  <div class="card">
    <div class="cal-head">
      <button class="nav" id="cal-prev" aria-label="Previous month">‹</button>
      <div><span id="month"></span><small id="month-count"></small></div>
      <button class="nav" id="cal-next" aria-label="Next month">›</button>
    </div>
    <div class="cal" id="cal"></div>
  </div>
</section>

<section id="tab-progress" class="screen tab" hidden>
  <header class="head">
    <div><div class="eyebrow">Side-view photos</div><h1>Progress</h1></div>
    <span class="pic-actions">
      <button class="add ghost" id="compare-btn" hidden>Compare</button>
      <label class="add">+ Add<input type="file" accept="image/*" id="pic-in" hidden></label>
    </span>
  </header>
  <div class="pics" id="pics"></div>
  <p class="empty card" id="pics-empty">Take a side-view photo every week or two, same spot and distance. Photos stay on this phone only.</p>
</section>

<nav class="tabbar" role="tablist">
  <button role="tab" data-tab="today" aria-selected="true">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Today
  </button>
  <button role="tab" data-tab="history" aria-selected="false">
    <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/><path d="M8.5 15l2 2 4-4"/></svg>History
  </button>
  <button role="tab" data-tab="progress" aria-selected="false">
    <svg viewBox="0 0 24 24"><path d="M4 8a2 2 0 0 1 2-2h2l1.5-2h5L16 6h2a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><circle cx="12" cy="13" r="3.5"/></svg>Progress
  </button>
</nav>
</main>

<div class="viewer" id="viewer" hidden>
  <img id="viewer-img" alt="Progress photo">
  <div class="viewer-bar">
    <span id="viewer-date"></span>
    <button id="viewer-del">Delete</button>
    <button id="viewer-close">Close</button>
  </div>
</div>

<div class="viewer" id="compare" hidden>
  <div class="slider" id="slider">
    <img id="cmp-b" alt="After photo">
    <img id="cmp-a" alt="Before photo">
    <div class="handle"></div>
  </div>
  <div class="cmp-pick">
    <label>Before<select id="cmp-a-sel"></select></label>
    <label>After<select id="cmp-b-sel"></select></label>
  </div>
  <div class="viewer-bar">
    <span>Drag to compare</span>
    <button id="compare-close">Close</button>
  </div>
</div>

<section id="run" class="screen" hidden>
  <div class="top">
    <button class="icon-btn" id="exit" aria-label="End session">✕</button>
    <span id="count"></span>
    <span style="width:48px"></span>
  </div>
  <div class="bar"><i id="bar"></i></div>
  <span class="chip" id="chip"></span>
  <h2 id="name"></h2>
  <div class="label" id="label"></div>
  <svg id="fig" viewBox="0 0 200 200"></svg>
  <div class="timer"><b id="big"></b><span id="sub"></span></div>
  <p class="cue" id="cue"></p>
  <div class="controls" id="controls">
    <button id="prev" aria-label="Back">⏮</button>
    <button id="pause" class="play" aria-label="Pause">❚❚</button>
    <button id="next" aria-label="Skip">⏭</button>
  </div>
  <button class="go" id="home-btn" hidden>Back home</button>
</section>

<script>
// ---------- figures ----------
// Poses are joint coordinates in a 200x200 box. Each exercise animates between pose a and b.
const FRONT = { h:[100,40], n:[100,56], sL:[84,60], sR:[116,60], eL:[80,88], eR:[120,88], wL:[78,114], wR:[122,114],
                p:[100,115], kL:[92,150], kR:[108,150], fL:[90,185], fR:[110,185] };
const SIDE  = { h:[102,40], n:[100,56], sL:[100,60], sR:[100,60], eL:[98,88], eR:[102,88], wL:[99,114], wR:[104,114],
                p:[100,115], kL:[98,150], kR:[103,150], fL:[97,185], fR:[104,185] };
const both = (k, v) => ({ [k+'L']: v, [k+'R']: v });
const FLOOR = '<line class="prop" x1="10" y1="189" x2="190" y2="189"/>';
const wall = x => `<line class="prop" x1="${x}" y1="10" x2="${x}" y2="189"/>` + FLOOR;
const CHEER = { ...FRONT, eL:[76,32], wL:[70,8], eR:[124,32], wR:[130,8] };

const EX = [
  { name: 'Pec minor ball release', kind: 'release', hold: 60, sides: true,
    cue: 'Face a wall with the ball just under your collarbone, near the shoulder. Lean in and slowly raise and lower that arm.',
    fig: { face: -1, props: () => wall(80) + '<circle class="ball" cx="90" cy="72" r="6"/>',
      a: { ...SIDE, h:[98,40], n:[98,56], ...both('s',[98,60]), p:[102,115] },
      b: { ...SIDE, h:[98,40], n:[98,56], ...both('s',[98,60]), p:[102,115], eL:[96,36], wL:[98,10] } } },
  { name: 'Foam roller extension', kind: 'release', hold: 90,
    cue: 'Roller under your upper back, hands behind your head, hips down. Extend back over it, then curl up. Shift it an inch every few reps.',
    fig: { face: -1, props: () => FLOOR + '<circle class="prop fill" cx="92" cy="178" r="10"/>',
      a: { h:[76,148], n:[88,158], ...both('s',[90,159]), ...both('e',[92,136]), ...both('w',[80,140]),
           p:[132,181], ...both('k',[156,152]), ...both('f',[176,186]) },
      b: { h:[70,172], n:[86,166], ...both('s',[88,167]), ...both('e',[82,146]), ...both('w',[72,160]),
           p:[132,181], ...both('k',[156,152]), ...both('f',[176,186]) } } },
  { name: 'Doorway pec stretch', kind: 'stretch', hold: 45, sets: 2,
    cue: 'Forearm on the door frame, elbow at shoulder height. Step through until your chest opens. Breathe, don’t shrug.',
    fig: { face: 1, props: () => wall(86),
      a: { ...SIDE, h:[103,40], eL:[87,62], wL:[87,36], kR:[108,150], fR:[114,185] },
      b: { h:[117,44], n:[113,58], ...both('s',[113,62]), eL:[87,62], wL:[87,36], eR:[116,90], wR:[118,116],
           p:[108,116], kL:[102,150], fL:[96,185], kR:[124,148], fR:[128,185] } } },
  { name: 'Upper trap stretch', kind: 'stretch', hold: 45, sides: true,
    cue: 'Ear toward shoulder, hand over your head gently adds weight. Keep the other shoulder pulled down.',
    fig: { face: 0, props: () => FLOOR,
      a: { ...FRONT, eR:[128,34], wR:[94,28], wL:[74,118] },
      b: { ...FRONT, h:[112,45], n:[101,56], eR:[134,40], wR:[104,32], wL:[72,120] } } },
  { name: 'SCM stretch', kind: 'stretch', hold: 30, sides: true,
    cue: 'Hold your collarbone down with one hand. Tilt your head back and away, then turn your face toward the hand until you feel the front of your neck stretch.',
    fig: { face: 0, props: () => FLOOR,
      a: { ...FRONT, eL:[90,84], wL:[100,64] },
      b: { ...FRONT, h:[110,36], n:[102,55], eL:[90,84], wL:[100,64] } } },
  { name: 'Chin tucks', kind: 'strength', reps: 10, tempo: 6, sets: 2,
    cue: 'Glide your head straight back into a double chin and hold ~5 seconds. Eyes level, don’t nod down.',
    fig: { face: 1, props: () => FLOOR,
      a: { ...SIDE, h:[112,43], n:[103,57] },
      b: { ...SIDE, h:[100,40] } } },
  { name: 'Wall angels', kind: 'strength', reps: 10, tempo: 4, sets: 2,
    cue: 'Head, upper back and butt against the wall. Slide arms up and down slowly, keeping wrists and elbows on the wall.',
    fig: { face: 0, props: () => FLOOR + '<rect class="prop fill" x="40" y="4" width="120" height="183" rx="8"/>',
      a: { ...FRONT, eL:[62,60], wL:[62,32], eR:[138,60], wR:[138,32] },
      b: { ...FRONT, eL:[76,30], wL:[88,6], eR:[124,30], wR:[112,6] } } },
  { name: 'Band pull-aparts', kind: 'strength', reps: 15, tempo: 3, sets: 2,
    cue: 'Arms straight at shoulder height. Pull the band to your chest by squeezing your shoulder blades together.',
    fig: { face: 0, props: () => FLOOR, over: P => `<line class="band" x1="${P.wL[0]}" y1="${P.wL[1]}" x2="${P.wR[0]}" y2="${P.wR[1]}"/>`,
      a: { ...FRONT, eL:[90,70], wL:[95,66], eR:[110,70], wR:[105,66] },
      b: { ...FRONT, eL:[58,62], wL:[32,62], eR:[142,62], wR:[168,62] } } },
  { name: 'Prone Y–T raises', kind: 'strength', reps: 10, tempo: 4, sets: 2,
    cue: 'Face down, thumbs up, forehead resting. Lift your arms in a Y, then a T on the next rep. Squeeze low between the shoulder blades.',
    fig: { face: -1, props: () => FLOOR,
      a: { h:[48,176], n:[64,180], ...both('s',[66,180]), ...both('e',[46,182]), ...both('w',[26,183]),
           p:[122,181], ...both('k',[152,183]), ...both('f',[182,183]) },
      b: { h:[48,176], n:[64,180], ...both('s',[66,180]), ...both('e',[46,166]), ...both('w',[28,154]),
           p:[122,181], ...both('k',[152,183]), ...both('f',[182,183]) } } },
  { name: 'Deep neck flexor lift', kind: 'strength', reps: 8, tempo: 8, sets: 2,
    cue: 'Lie on your back, knees bent. Nod your chin down slightly, then lift your head about an inch off the floor. Hold 5 seconds, lower slowly. Don’t let your chin poke up.',
    fig: { face: 0, props: () => FLOOR,
      a: { h:[40,177], n:[56,180], ...both('s',[58,181]), ...both('e',[82,184]), ...both('w',[104,184]),
           p:[112,181], ...both('k',[140,150]), ...both('f',[164,186]) },
      b: { h:[46,166], n:[60,176], ...both('s',[62,180]), ...both('e',[84,184]), ...both('w',[106,184]),
           p:[112,181], ...both('k',[140,150]), ...both('f',[164,186]) } } },
];
const KIND = { release: 'var(--release)', stretch: 'var(--stretch)', strength: 'var(--strength)', rest: 'var(--rest)' };

function draw(svg, fig, phase) {
  const k = (1 - Math.cos(2 * Math.PI * phase)) / 2; // a -> b -> a
  const P = {};
  for (const j in fig.a) P[j] = fig.a[j].map((v, i) => +(v + (fig.b[j][i] - v) * k).toFixed(1));
  const L = (...js) => `<polyline points="${js.map(j => P[j]).join(' ')}"/>`;
  const [hx, hy] = P.h;
  svg.innerHTML = (fig.props ? fig.props(P) : '') + '<g class="fig">' +
    L('sL','n','sR') + L('n','p') + L('sL','eL','wL') + L('sR','eR','wR') + L('fL','kL','p','kR','fR') +
    `<circle cx="${hx}" cy="${hy}" r="11"/>` +
    (fig.face ? `<circle class="eye" cx="${hx + fig.face * 5}" cy="${hy - 2}" r="2"/>` : '') + '</g>' + (fig.over ? fig.over(P) : '');
}

// ---------- routine ----------
const REST_BETWEEN = 15, REST_SETS = 10, SWITCH = 5;
function build() {
  const steps = [];
  EX.forEach((e, i) => {
    steps.push({ rest: true, ex: e, secs: i ? REST_BETWEEN : 5, label: i ? 'Up next' : 'Get ready' });
    const sets = e.sets || 1, sides = e.sides ? ['Left', 'Right'] : [null];
    let first = true;
    for (let set = 1; set <= sets; set++) for (const side of sides) {
      if (!first) steps.push({ rest: true, ex: e, secs: side === 'Right' ? SWITCH : REST_SETS,
                               label: side === 'Right' ? 'Switch sides' : 'Rest' });
      first = false;
      steps.push({ ex: e, secs: e.reps ? e.reps * e.tempo : e.hold,
                   label: [sets > 1 && `Set ${set} of ${sets}`, side].filter(Boolean).join(' · ') });
    }
  });
  return steps;
}
const STEPS = build();
const fmt = s => s >= 60 ? `${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}` : String(s);

// ---------- history ----------
const $ = id => document.getElementById(id);
const key = d => d.toLocaleDateString('en-CA'); // YYYY-MM-DD, local time
let done;
try { done = new Set(JSON.parse(localStorage.getItem('done') || '[]')); } catch { done = new Set(); }
function save() { try { localStorage.setItem('done', JSON.stringify([...done])); } catch {} }
function streak() {
  const d = new Date(); let n = 0;
  if (!done.has(key(d))) d.setDate(d.getDate() - 1);
  while (done.has(key(d))) { n++; d.setDate(d.getDate() - 1); }
  return n;
}
function best() {
  let top = 0, run = 0, prev;
  for (const k of [...done].sort()) {
    const d = new Date(k + 'T00:00');
    if (prev) prev.setDate(prev.getDate() + 1);
    run = prev && key(prev) === k ? run + 1 : 1;
    top = Math.max(top, run); prev = d;
  }
  return top;
}
let calY, calM; // month shown in History
const DOW = 'MTWTFSS', dow = d => (d.getDay() + 6) % 7; // weeks start on Monday
function renderCal() {
  const now = new Date(), first = new Date(calY, calM, 1);
  $('month').textContent = first.toLocaleDateString(undefined, { month: 'long', year: 'numeric' });
  let html = DOW.split('').map(c => `<div class="dow">${c}</div>`).join(''), n = 0;
  html += '<div></div>'.repeat(dow(first));
  for (let d = 1, last = new Date(calY, calM + 1, 0).getDate(); d <= last; d++) {
    const day = new Date(calY, calM, d), k = key(day);
    if (done.has(k)) n++;
    html += `<div class="d${done.has(k) ? ' done' : ''}${k === key(now) ? ' today' : day > now ? ' future' : ''}">${d}</div>`;
  }
  $('cal').innerHTML = html;
  $('month-count').textContent = `${n} session${n === 1 ? '' : 's'}`;
  $('cal-next').disabled = calY === now.getFullYear() && calM === now.getMonth();
}
function moveMonth(by) {
  const d = new Date(calY, calM + by, 1);
  if (d > new Date()) return;
  calY = d.getFullYear(); calM = d.getMonth();
  renderCal();
}
$('cal-prev').onclick = () => moveMonth(-1);
$('cal-next').onclick = () => moveMonth(1);
let swipeX;
$('cal').ontouchstart = e => swipeX = e.touches[0].clientX;
$('cal').ontouchend = e => {
  const dx = e.changedTouches[0].clientX - swipeX;
  if (Math.abs(dx) > 50) moveMonth(dx > 0 ? -1 : 1);
};
function renderHome() {
  const now = new Date();
  $('today-date').textContent = now.toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
  $('streak').textContent = $('st-streak').textContent = streak();
  $('st-best').textContent = best();
  $('total').textContent = done.size;
  let week = '';
  for (let n = 0; n < 7; n++) {
    const d = new Date(now); d.setDate(now.getDate() - dow(now) + n);
    const k = key(d);
    week += `<div class="${done.has(k) ? 'done' : ''}${k === key(now) ? ' today' : ''}">${DOW[n]}<i>${done.has(k) ? '✓' : d.getDate()}</i></div>`;
  }
  $('week').innerHTML = week;
  calY = now.getFullYear(); calM = now.getMonth();
  renderCal();
  $('mins').textContent = Math.round(STEPS.reduce((a, s) => a + s.secs, 0) / 60);
  $('ex-count').textContent = `${EX.length} exercises`;
  $('list').innerHTML = EX.map(e => `<li><span><i class="dot" style="background:${KIND[e.kind]}"></i>${e.name}</span><small>${
    e.reps ? `${e.sets || 1}×${e.reps}` : `${e.sets > 1 ? e.sets + '×' : ''}${e.hold}s${e.sides ? '/side' : ''}`}</small></li>`).join('');
  $('legend').innerHTML = ['release', 'stretch', 'strength'].map(k => `<span><i class="dot" style="background:${KIND[k]}"></i>${k}</span>`).join('');
}
function show(name) {
  for (const b of document.querySelectorAll('.tabbar button')) {
    const on = b.dataset.tab === name;
    b.setAttribute('aria-selected', on);
    $('tab-' + b.dataset.tab).hidden = !on;
  }
  scrollTo(0, 0);
}
document.querySelector('.tabbar').onclick = e => { const b = e.target.closest('button'); if (b) show(b.dataset.tab); };

// ---------- progress pics ----------
// Stored in IndexedDB on this device only; nothing is uploaded anywhere.
const dbp = new Promise((res, rej) => {
  const r = indexedDB.open('posture', 1);
  r.onupgradeneeded = () => r.result.createObjectStore('pics', { keyPath: 'id', autoIncrement: true });
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
async function pics(mode, fn) {
  const tx = (await dbp).transaction('pics', mode), req = fn(tx.objectStore('pics'));
  return new Promise((res, rej) => { tx.oncomplete = () => res(req.result); tx.onerror = () => rej(tx.error); });
}
// Phone photos are 3–5 MB; a 1600px JPEG is plenty to compare posture and keeps storage small.
async function shrink(file, max = 1600) {
  const img = new Image(), url = URL.createObjectURL(file);
  img.src = url;
  await img.decode();
  URL.revokeObjectURL(url);
  const s = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight)), c = document.createElement('canvas');
  c.width = Math.round(img.naturalWidth * s); c.height = Math.round(img.naturalHeight * s);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(res => c.toBlob(res, 'image/jpeg', .85));
}
const nice = k => new Date(k + 'T00:00').toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
let picURLs = [];
async function renderPics() {
  let all = [];
  try { all = (await pics('readonly', s => s.getAll())).reverse(); } catch {} // newest first
  picURLs.forEach(URL.revokeObjectURL);
  picURLs = all.map(p => URL.createObjectURL(p.blob));
  $('pics').innerHTML = all.map((p, n) => `<button data-n="${n}"><img src="${picURLs[n]}" alt=""><span>${nice(p.date)}</span></button>`).join('');
  $('pics-empty').hidden = all.length > 0;
  $('compare-btn').hidden = all.length < 2;
  $('compare-btn').onclick = () => {
    // Oldest on the left as "before", newest on the right as "after".
    const opts = all.map((p, n) => `<option value="${n}">${nice(p.date)}</option>`).join('');
    $('cmp-a-sel').innerHTML = $('cmp-b-sel').innerHTML = opts;
    $('cmp-a-sel').value = all.length - 1; $('cmp-b-sel').value = 0;
    $('cmp-a').src = picURLs[all.length - 1]; $('cmp-b').src = picURLs[0];
    $('slider').style.setProperty('--x', '50%');
    $('compare').hidden = false;
  };
  $('pics').onclick = e => {
    const b = e.target.closest('button');
    if (!b) return;
    const p = all[b.dataset.n];
    $('viewer-img').src = picURLs[b.dataset.n];
    $('viewer-date').textContent = nice(p.date);
    $('viewer-del').onclick = async () => {
      if (!confirm('Delete this photo?')) return;
      await pics('readwrite', s => s.delete(p.id));
      $('viewer').hidden = true;
      renderPics();
    };
    $('viewer').hidden = false;
  };
}
$('viewer-close').onclick = () => $('viewer').hidden = true;
$('compare-close').onclick = () => $('compare').hidden = true;
$('cmp-a-sel').onchange = e => $('cmp-a').src = picURLs[e.target.value];
$('cmp-b-sel').onchange = e => $('cmp-b').src = picURLs[e.target.value];
// Drag anywhere on the photo to move the divider.
function slide(e) {
  const r = $('slider').getBoundingClientRect();
  $('slider').style.setProperty('--x', `${Math.min(100, Math.max(0, 100 * (e.clientX - r.left) / r.width))}%`);
}
$('slider').onpointerdown = e => { $('slider').setPointerCapture(e.pointerId); slide(e); };
$('slider').onpointermove = e => { if ($('slider').hasPointerCapture(e.pointerId)) slide(e); };
$('pic-in').onchange = async e => {
  const f = e.target.files[0];
  e.target.value = '';
  if (!f) return;
  try {
    const blob = await shrink(f);
    await pics('readwrite', s => s.add({ date: key(new Date()), blob }));
    navigator.storage?.persist?.(); // ask iOS not to evict the photos
  } catch { alert('Couldn’t save that photo.'); }
  renderPics();
};

// ---------- sound & wake lock ----------
let ac, lock;
function beep(f = 880, dur = .12, at = 0) {
  if (!ac) return;
  const o = ac.createOscillator(), g = ac.createGain(), t0 = ac.currentTime + at;
  o.frequency.value = f;
  g.gain.setValueAtTime(.4, t0);
  g.gain.exponentialRampToValueAtTime(.001, t0 + dur);
  o.connect(g).connect(ac.destination);
  o.start(t0); o.stop(t0 + dur);
}
async function wake() { try { lock = await navigator.wakeLock?.request('screen'); } catch {} }
// No caching: GitHub Pages sends max-age=600 and iOS resumes frozen pages, so on every
// launch/resume fetch the page past the cache (which also refreshes the cache) and
// reload once if it changed. Never mid-session.
async function freshen() {
  try {
    const html = await (await fetch(location.href, { cache: 'reload' })).text();
    if (mode === 'run' || sessionStorage.getItem('html') === html) return;
    sessionStorage.setItem('html', html);
    location.reload();
  } catch {} // offline or storage blocked: keep what's loaded
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (mode === 'run') { wake(); ac?.resume(); } else freshen();
});

// ---------- session ----------
let mode = 'home', i = 0, t = 0, anim = 0, paused = false, lastLeft, rep, last = performance.now();

function go(n) {
  i = Math.max(0, n); t = 0; lastLeft = null; rep = 0;
  if (i >= STEPS.length) return finish();
  const s = STEPS[i];
  $('run').style.backgroundColor = KIND[s.rest ? 'rest' : s.ex.kind];
  $('chip').textContent = s.rest ? s.label : s.ex.kind;
  $('name').textContent = s.ex.name;
  $('label').textContent = s.rest ? '' : s.label;
  $('cue').textContent = s.ex.cue;
  $('count').textContent = `${EX.indexOf(s.ex) + 1} / ${EX.length}`;
  $('bar').style.width = `${100 * i / STEPS.length}%`;
  s.rest ? beep(440, .2) : beep(988, .3);
}

function finish() {
  mode = 'done';
  done.add(key(new Date())); save();
  lock?.release(); lock = null;
  [523, 659, 784, 1047].forEach((f, n) => beep(f, .25, n * .15));
  $('run').style.backgroundColor = KIND.stretch;
  $('chip').textContent = 'Complete';
  $('name').textContent = 'Nice work!';
  $('label').textContent = '';
  $('big').textContent = streak();
  $('sub').textContent = 'day streak';
  $('cue').textContent = 'Stand tall today. Shoulders back and down, chin gently tucked.';
  $('count').textContent = '';
  $('bar').style.width = '100%';
  $('controls').hidden = true;
  $('home-btn').hidden = false;
}

function goHome() {
  mode = 'home';
  lock?.release(); lock = null;
  $('run').hidden = true; $('home').hidden = false;
  renderHome();
}

$('start').onclick = () => {
  // Audio must be unlocked inside a tap on iOS.
  ac ||= new (window.AudioContext || window.webkitAudioContext)();
  ac.resume();
  wake();
  mode = 'run'; paused = false;
  $('pause').textContent = '❚❚';
  $('controls').hidden = false; $('home-btn').hidden = true;
  $('home').hidden = true; $('run').hidden = false;
  go(0);
};
$('pause').onclick = () => { paused = !paused; $('pause').textContent = paused ? '▶' : '❚❚'; };
$('next').onclick = () => go(i + 1);
$('prev').onclick = () => go(t > 2 ? i : i - 1);
$('exit').onclick = () => { if (mode === 'done' || confirm('End this session?')) goHome(); };
$('home-btn').onclick = goHome;

function frame(now) {
  // Cap dt so time spent backgrounded doesn't fast-forward the routine.
  const dt = Math.min((now - last) / 1000, .25); last = now;
  if (mode === 'done') {
    anim += dt;
    draw($('fig'), { a: FRONT, b: CHEER, props: () => FLOOR }, anim / 1.5);
  } else if (mode === 'run') {
    const s = STEPS[i];
    if (!paused) { t += dt; anim += dt; }
    const left = Math.max(0, Math.ceil(s.secs - t));
    if (s.ex.reps && !s.rest) {
      const r = Math.min(Math.floor(t / s.ex.tempo) + 1, s.ex.reps);
      if (r !== rep) { if (rep) beep(620, .08); rep = r; }
      $('big').textContent = rep;
      $('sub').textContent = `of ${s.ex.reps} reps · ${fmt(left)} left`;
    } else {
      if (left !== lastLeft && left <= 3 && left > 0) beep(660, .1);
      $('big').textContent = fmt(left);
      $('sub').textContent = s.rest ? 'rest' : 'hold';
    }
    lastLeft = left;
    draw($('fig'), s.ex.fig, s.rest ? anim / 4 : t / (s.ex.tempo || 4));
    if (t >= s.secs) go(i + 1);
  }
  requestAnimationFrame(frame);
}

renderHome();
renderPics();
requestAnimationFrame(frame);
freshen();
</script>
</body>
</html>
